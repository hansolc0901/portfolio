<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>찾아오는 길 | 최한솔 포트폴리오</title>
  <meta name="description" content="상명대학교 천안캠퍼스 C404a 찾아오는 길과 현재 날씨, 방문 예약 안내입니다.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #030405;
      --card: #0b0c0e;
      --white: #f4f4f2;
      --muted: rgba(244, 244, 242, 0.62);
      --dim: rgba(244, 244, 242, 0.4);
      --line: rgba(244, 244, 242, 0.16);
      --amber: #f5b21c;
      --sans: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      --serif: 'Instrument Serif', Georgia, serif;
      --pad: clamp(16px, 6vw, 80px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      line-height: 1.6;
      color: var(--white);
      background: var(--black);
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    a { color: inherit; text-decoration: none; }

    .container { max-width: 1080px; margin: 0 auto; padding: 0 var(--pad); }

    .site-header { border-bottom: 1px solid var(--line); }
    .navbar { display: flex; justify-content: space-between; align-items: center; height: 64px; }
    .nav-logo { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; }
    .nav-back { font-size: 13px; color: var(--muted); }
    .nav-back:hover { color: var(--white); }

    main { padding: 56px 0 96px; }

    .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); }
    h1 { margin-top: 8px; font-size: clamp(32px, 5vw, 52px); font-weight: 500; line-height: 1.2; }
    h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; }
    .lead { margin-top: 12px; color: var(--muted); }

    .address {
      margin-top: 32px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
    }
    .address dt { font-size: 12px; color: var(--dim); }
    .address dd { margin-top: 4px; font-size: 18px; font-weight: 500; }

    .map {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      background: var(--card);
    }
    .map iframe { display: block; width: 100%; height: 100%; border: 0; }

    .weather {
      margin-top: 16px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
    }
    .weather h2 { font-size: 15px; font-weight: 500; }
    .weather-values { display: flex; gap: 40px; margin-top: 12px; }
    .weather-values dt { font-size: 12px; color: var(--dim); }
    .weather-values dd { font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .weather-time { margin-top: 8px; font-size: 12px; color: var(--dim); }

    .sources { margin-top: 16px; font-size: 12px; color: var(--dim); }
    .sources a { text-decoration: underline; }
    .sources a:hover { color: var(--muted); }

    .cta { margin-top: 40px; text-align: center; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 999px;
      background: var(--amber);
      color: var(--black);
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }

    @media (max-width: 560px) {
      .map { aspect-ratio: 4 / 5; }
      .weather-values { gap: 28px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <nav class="navbar container">
    <a href="index.html" class="nav-logo">CHOI HANSOL</a>
    <a href="index.html" class="nav-back">← 포트폴리오로 돌아가기</a>
  </nav>
</header>

<main class="container">
  <p class="eyebrow">Visit</p>
  <h1>찾아오는 <em>길</em></h1>
  <p class="lead">포트폴리오를 보고 직접 만나고 싶으시면 아래 장소로 찾아와 주세요.</p>

  <dl class="address">
    <dt>주소</dt>
    <dd>상명대학교 천안캠퍼스 (상명대길 31) C404a</dd>
  </dl>

  <div class="map">
    <iframe
      title="상명대학교 천안캠퍼스 지도"
      src="https://www.openstreetmap.org/export/embed.html?bbox=127.1730%2C36.8295%2C127.1850%2C36.8365&amp;layer=mapnik&amp;marker=36.8330%2C127.1790"
      loading="lazy"></iframe>
  </div>

  <section class="weather" aria-live="polite">
    <h2>현재 날씨 · 천안시 안서동</h2>
    <dl class="weather-values">
      <div>
        <dt>온도</dt>
        <dd id="temp">–</dd>
      </div>
      <div>
        <dt>습도</dt>
        <dd id="humidity">–</dd>
      </div>
    </dl>
    <p class="weather-time" id="weatherTime">날씨 정보를 불러오는 중입니다.</p>
  </section>

  <p class="sources">
    지도 출처: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
    · 날씨 출처: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
  </p>

  <div class="cta">
    <a href="reservation.html" class="btn">방문 예약하기</a>
  </div>
</main>

<script>
  // 상명대학교 천안캠퍼스 좌표 (OpenStreetMap 기준)
  const LAT = 36.8330;
  const LON = 127.1790;

  const url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + LAT + '&longitude=' + LON
    + '&current=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul';

  fetch(url)
    .then(res => {
      if (!res.ok) throw new Error(res.status);
      return res.json();
    })
    .then(data => {
      const now = data.current;
      document.getElementById('temp').textContent = now.temperature_2m.toFixed(1) + '°C';
      document.getElementById('humidity').textContent = now.relative_humidity_2m + '%';
      document.getElementById('weatherTime').textContent =
        now.time.replace('T', ' ') + ' 기준 (한국 시간)';
    })
    .catch(() => {
      document.getElementById('weatherTime').textContent =
        '날씨 정보를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';
    });
</script>

</body>
</html>
